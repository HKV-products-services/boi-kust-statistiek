[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kuststatistiek/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kuststatistiek"]

[project]
name = "boi-kust-statistiek"
dynamic = ["version"]
description = "Python version of the KNMI wind and sea water level statistics (BOI kust, Feb2026)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GNU-GPL V3"}
authors = [
  { name = "P. Kindermann", email = "P.Kindermann@hkv.nl" },
]

dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pyreadr",
  "scikit-misc",
  "scipy",
  "tqdm",
]

[project.urls]
Documentation = "https://hkv-products-services.github.io/boi-kust-statistiek"
Source = "https://github.com/HKV-products-services/boi-kust-statistiek"
